# Checks the README's on-chain claims against NEAR testnet, Bitcoin testnet4, Base Sepolia and
# Solana devnet (scripts/verify.mjs): read-only, no keys. Daily, so a claim that stops holding shows.
name: Claims on chain

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: each locked contract names the commit it was built from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # --strict: a claim an endpoint didn't answer for fails too, so green means every claim was
      # checked. Free public endpoints rate-limit now and then, so one retry, a minute later.
      - name: pnpm verify --strict
        run: |
          node scripts/verify.mjs --strict --json claims.json && exit 0
          code=$?
          [ "$code" = "2" ] || exit "$code"
          echo "Some endpoints didn't answer; checking again in 60 s."
          sleep 60
          node scripts/verify.mjs --strict --json claims.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claims
          path: claims.json
