[package]
name = "schedule"
version = "0.1.0"
edition = "2021"
publish = false
repository = "https://github.com/successaje/bearer"
description = "Holds a sealed Bearer vault until a chosen date, then hands it to a chosen recipient"

# Same pinned image as the Bearer contract, so the schedule can be rebuilt byte for byte too.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.98.1"
image_digest = "sha256:90cf2abe31d75946d82f1c6eee70802332b4d499ac39c01a5c41f228000ecb8a"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
