<style>
@page { size: A4; margin: 17mm 17mm 18mm 17mm; }
@page :first { margin: 0; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body {
  margin: 0; padding: 0; max-width: none;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 10pt; line-height: 1.55; color: #222; background: #fff;
}
.cover {
  width: 210mm; height: 297mm; box-sizing: border-box; padding: 0 17mm;
  display: flex; flex-direction: column; justify-content: center;
  background: linear-gradient(165deg, #0c0c0f 0%, #131315 55%, #3a2a08 100%);
  color: #fff; break-after: page;
}
.cover .seal {
  width: 64px; height: 64px; border-radius: 50%;
  background: radial-gradient(circle at 38% 34%, #f2d26a 0%, #d9b437 45%, #a8841a 100%);
  box-shadow: 0 0 0 7px rgba(201, 162, 39, 0.22);
}
.cover .cover-title { font-size: 46pt; font-weight: 700; margin: 34px 0 6px; border: 0; padding: 0; color: #fff; letter-spacing: -0.5px; }
.cover .tagline { color: #d4a72c; font-size: 15pt; margin: 0 0 26px; }
.cover .desc { color: #e2e2e2; font-size: 11.5pt; line-height: 1.6; max-width: 150mm; margin: 0 0 22px; }
.cover .version {
  display: inline-block; align-self: flex-start; margin: 0 0 22px; padding: 4px 12px;
  border: 1px solid #d4a72c; border-radius: 999px; color: #f0d27a; font-size: 9pt;
}
.cover .meta { color: #a9a9a9; font-size: 9pt; line-height: 1.9; margin: 0; }

h2 {
  break-before: page; font-size: 19pt; margin: 0 0 14px; padding-bottom: 8px;
  border-bottom: 3px solid #d4a72c; color: #1a1a1a;
}
h3 { font-size: 12.5pt; color: #333; margin: 20px 0 8px; break-after: avoid; }
p, li { orphans: 3; widows: 3; }
ul, ol { padding-left: 22px; }
h2#contents + ul { list-style: none; padding-left: 0; font-size: 11pt; line-height: 2; }
li { margin: 2px 0; }
a { color: #1a1a1a; text-decoration: none; }
code {
  font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 0.84em;
  background: #f2eee3; padding: 1px 4px; border-radius: 3px;
}
pre, div.sourceCode {
  background: #141417 !important; color: #e8e8e8; border-radius: 8px;
  font-size: 7.4pt; line-height: 1.45; break-inside: avoid;
}
pre { padding: 12px 14px; white-space: pre-wrap; word-break: break-word; margin: 10px 0; }
div.sourceCode pre { margin: 0; }
pre code { background: none; padding: 0; font-size: 1em; color: inherit; }
blockquote {
  margin: 12px 0; padding: 12px 18px; background: #fbf4d9;
  border-left: 5px solid #d4a72c; font-size: 11pt;
}
blockquote p { margin: 0; }
table { border-collapse: collapse; width: 100%; margin: 10px 0 14px; font-size: 8.6pt; line-height: 1.45; }
thead { display: table-header-group; }
th { background: #1f1b16; color: #fff; text-align: left; padding: 7px 8px; font-weight: 600; }
td { padding: 6px 8px; border-bottom: 1px solid #e9e4d8; vertical-align: top; }
tbody tr:nth-child(even) td { background: #faf8f3; }
tr { break-inside: avoid; }
td code { word-break: break-word; }
input[type="checkbox"] { margin-right: 6px; }
</style>
