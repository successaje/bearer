[package]
name = "bearer"
version = "0.3.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true, features = ["unstable"] }
near-contract-standards = { workspace = true }
# Already in the tree through near-sdk; used for Solana addresses and blockhashes.
bs58 = "0.5.1"

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing", "unstable"] }
